name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test backend
        run: npm test --prefix backend
      - name: Check frontend JavaScript
        run: node --check frontend/src/main.js